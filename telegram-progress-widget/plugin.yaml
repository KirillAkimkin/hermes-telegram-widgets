name: telegram-progress-widget
version: 0.1.0
description: "\"Hermes is working\" card on long replies in private Telegram chats: elapsed timer, latest steps, Stop; deleted when the answer arrives."
author: local
kind: standalone
entrypoint: __init__.py
platforms:
  - linux
  - macos
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_session_end
  - agent_loop_stopped
